name: Test LLVM install with arch and directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "17"
          arch: "x64"
          directory: "/tmp/llvm-custom"
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL'"
      - name: Assert LLVM installed in custom directory
        run: |
          if [ ! -d "/tmp/llvm-custom" ]; then
            echo "FAIL: custom directory /tmp/llvm-custom does not exist"
            exit 1
          fi
          echo "PASS: custom directory exists"
          ls /tmp/llvm-custom/
