name: Test arch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "17"
          arch: x64
      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version=$VERSION"
      - name: Assert clang is available
        run: |
          if ! command -v clang &>/dev/null && ! ls /usr/lib/llvm-*/bin/clang &>/dev/null 2>&1; then
            echo "FAIL: clang not found after install"
            exit 1
          fi
          echo "PASS: clang found"
