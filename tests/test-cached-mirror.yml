name: Test LLVM install with cached and mirror-url
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install LLVM to simulate cache
        run: |
          # Install LLVM 17 via apt to simulate a cached install
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-17 llvm-17 2>/dev/null || true
      - id: action
        uses: .
        with:
          version: "17"
          cached: "true"
          mirror-url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-"
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS: version output is '$ACTUAL'"
