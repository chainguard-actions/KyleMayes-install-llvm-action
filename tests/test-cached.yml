name: Test LLVM install with cached input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install LLVM to simulate cache
        run: |
          sudo apt-get install -y llvm-17 clang-17 2>/dev/null || true
      - id: action
        uses: .
        with:
          version: "17"
          directory: /usr/lib/llvm-17
          cached: "true"
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS"
