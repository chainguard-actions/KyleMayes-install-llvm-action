name: Test LLVM install with directory and env inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "17"
          directory: /tmp/llvm-custom
          env: "true"
      - name: Assert version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected version output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert CC and CXX are set
        run: |
          echo "CC=$CC"
          echo "CXX=$CXX"
          if [ -z "$CC" ]; then
            echo "FAIL: expected CC to be set"
            exit 1
          fi
          if [ -z "$CXX" ]; then
            echo "FAIL: expected CXX to be set"
            exit 1
          fi
          echo "PASS"
